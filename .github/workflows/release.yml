name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled one may be older.
      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Test
        run: npm test

      - name: Syntax check
        run: npm run check

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # registry credential. The trusted publisher must be configured on
      # npmjs.com first (package settings → Trusted Publisher → GitHub Actions).
      - name: Publish
        run: npm publish --provenance --access public
